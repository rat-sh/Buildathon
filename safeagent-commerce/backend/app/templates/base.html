<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SafeAgent Commerce — Razorpay Buildathon{% endblock %}</title>
    <!-- HTMX for dynamic interactions without SPA rewrite -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS Variables & Animations from Figma -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="h-full flex flex-col antialiased selection:bg-blue-100 selection:text-blue-900" style="background: var(--color-background); color: var(--color-foreground);">

    <!-- Global Top Nav Header (Figma exact match) -->
    <header class="shrink-0 border-b z-50 shadow-sm" style="background: var(--color-card); borderColor: var(--color-border);">
        <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
            
            <!-- Brand Logo & Title -->
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center transition-transform group-hover:scale-105 nav-brand-icon">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <path d="M7 1L12 4v3c0 3-2 5-5 6C4 13 2 11 2 7V4L7 1z" fill="white" fill-opacity="0.95" />
                    </svg>
                </div>
                <span class="font-semibold text-sm tracking-tight" style="color: var(--color-foreground);">
                    SafeAgent Commerce
                </span>
            </a>

            <!-- Navigation Links -->
            <nav class="flex items-center gap-1.5">
                <a href="/" 
                   class="px-4 py-1.5 rounded text-sm font-medium transition-all {% if active_page == 'chat' or active_page == 'shopping' %}bg-slate-100 text-blue-700 font-semibold{% else %}text-slate-500 hover:text-slate-900 hover:bg-slate-50{% endif %}">
                   Shopping
                </a>
                <a href="/admin/audit" 
                   class="px-4 py-1.5 rounded text-sm font-medium transition-all {% if active_page == 'audit' %}bg-slate-100 text-blue-700 font-semibold{% else %}text-slate-500 hover:text-slate-900 hover:bg-slate-50{% endif %}">
                   Audit Log
                </a>
            </nav>

            <!-- Status Pill & API Link -->
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium mono validator-active-pill"
                     style="color: var(--color-success); border: 1px solid var(--color-success-border);">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-600 animate-pulse inline-block"></span>
                    Validator active
                </div>
                <a href="/docs" target="_blank" class="hidden sm:inline-flex text-xs font-medium text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded transition-colors">
                    API Docs ↗
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 min-h-0 flex flex-col">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
