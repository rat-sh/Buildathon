<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SafeAgent Commerce — Razorpay Buildathon{% endblock %}</title>
    <!-- HTMX for dynamic interactions without SPA rewrite -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS Variables & Animations from Figma -->
    <link rel="stylesheet" href="/static/css/styles.css">
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full flex flex-col antialiased {% block body_class %}{% endblock %}" style="{% block body_style %}background: var(--color-background); color: var(--color-foreground);{% endblock %}">

    <!-- Global Top Nav Header -->
    <header class="shrink-0 border-b z-50 {% if active_page == 'audit' %}ops-nav{% else %}shadow-sm{% endif %}"
            style="{% if active_page == 'audit' %}background: #1a2332; borderColor: #2d3a4f;{% else %}background: var(--color-card); borderColor: var(--color-border);{% endif %}">
        <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
            
            <!-- Brand Logo & Title -->
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center transition-transform group-hover:scale-105 nav-brand-icon">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <path d="M7 1L12 4v3c0 3-2 5-5 6C4 13 2 11 2 7V4L7 1z" fill="white" fill-opacity="0.95" />
                    </svg>
                </div>
                <span class="font-semibold text-sm tracking-tight" style="color: {% if active_page == 'audit' %}#e2e8f0{% else %}var(--color-foreground){% endif %};">
                    SafeAgent Commerce
                </span>
            </a>

            <!-- Navigation Links -->
            <nav class="flex items-center gap-1.5">
                <a href="/"
                   class="px-4 py-1.5 rounded text-sm font-medium transition-all
                   {% if active_page == 'audit' %}text-slate-400 hover:text-white hover:bg-slate-700/50
                   {% elif active_page == 'chat' or active_page == 'shopping' %}bg-slate-100 text-blue-700 font-semibold
                   {% else %}text-slate-500 hover:text-slate-900 hover:bg-slate-50{% endif %}">
                   Shopping
                </a>
                <a href="/admin/audit"
                   class="px-4 py-1.5 rounded text-sm font-medium transition-all
                   {% if active_page == 'audit' %}
                     bg-slate-700 text-emerald-400 font-semibold
                   {% else %}
                     text-slate-500 hover:text-slate-900 hover:bg-slate-50
                   {% endif %}">
                   Audit Log
                </a>
            </nav>

            <!-- Status Pill & API Link -->
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium mono {% if active_page != 'audit' %}validator-active-pill{% endif %}"
                     style="{% if active_page == 'audit' %}background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3);{% else %}color: var(--color-success); border: 1px solid var(--color-success-border);{% endif %}">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse inline-block"></span>
                    Validator active
                </div>
                <a href="/docs" target="_blank" class="hidden sm:inline-flex text-xs font-medium px-2.5 py-1 rounded transition-colors {% if active_page == 'audit' %}text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700{% else %}text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200{% endif %}">
                    API Docs ↗
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 min-h-0 flex flex-col">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
